name: Validate RaceDay Project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate Part 1 structure
        run: |
          test -d docs
          test -f docs/RaceDay_ERD.png
          test -f docs/API_Endpoint_Plan.pdf
          test -f docs/RaceDay_Database.sql
          echo "RaceDay Part 1 structure is valid."

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore

      - name: Run Unit Tests
        run: dotnet test --no-build --verbosity normal

      - name: Part 2 validation complete
        run: echo "RaceDay Part 2 build and tests passed - 3/3"