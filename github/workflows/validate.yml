name: Validate RaceDay Project

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List repository files
        run: |
          echo "Current directory:"
          pwd
          echo "Files in repository:"
          find . -type f | sort